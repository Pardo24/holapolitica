name: Mobile

# Builds the Capacitor shell in mobile/ for both stores.
#
# - On every push / PR that touches mobile/: unsigned check builds (Android
#   debug APK, iOS simulator build). Needs no secrets; proves the native
#   projects compile with the current toolchains (Xcode 26, targetSdk 36).
# - Manually (Actions -> Mobile -> Run workflow): signed release builds.
#   Android: a signed AAB, attached to the run as an artifact, to upload to
#   Play Console. iOS: archived, signed with cloud-managed signing and
#   uploaded straight to App Store Connect / TestFlight.
#
# The secrets each release needs are listed in mobile/docs/store-submission.md
# ("Secrets de GitHub"); a release job stops early naming any that is missing.

on:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile.yml'
  workflow_dispatch:
    inputs:
      release:
        description: 'Signed release build for'
        type: choice
        options: [both, android, ios]
        default: both

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: mobile

jobs:
  android:
    name: Android
    if: github.event_name != 'workflow_dispatch' || inputs.release != 'ios'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      # Play needs a strictly increasing versionCode per upload. The offset
      # keeps it above any build uploaded by hand before CI existed.
      - name: Version code
        working-directory: .
        run: echo "VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci

      - name: Check release secrets
        if: env.RELEASE == 'true'
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          for s in GOOGLE_SERVICES_JSON_BASE64 ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            [ -n "${!s}" ] || missing="$missing $s"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing (see mobile/docs/store-submission.md)"
            exit 1
          fi

      # Without google-services.json Firebase isn't initialised and the push
      # plugin's register() crashes the app, so a release never ships without
      # it. Check builds compile fine without it (the plugin is skipped).
      - name: Firebase config
        if: env.RELEASE == 'true'
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 -d > android/app/google-services.json

      - run: npx cap sync android

      - name: Check build (debug APK)
        if: env.RELEASE != 'true'
        working-directory: mobile/android
        run: ./gradlew --no-daemon assembleDebug

      - name: Signed release AAB
        if: env.RELEASE == 'true'
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/upload.jks"
          {
            echo "storeFile=$RUNNER_TEMP/upload.jks"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > keystore.properties
          ./gradlew --no-daemon bundleRelease
          rm -f keystore.properties "$RUNNER_TEMP/upload.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE == 'true' && format('holapolitica-android-{0}-aab', env.VERSION_CODE) || 'holapolitica-android-debug-apk' }}
          path: |
            mobile/android/app/build/outputs/bundle/release/*.aab
            mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

  ios:
    name: iOS
    if: github.event_name != 'workflow_dispatch' || inputs.release != 'android'
    # Apple has required Xcode 26 / the iOS 26 SDK for uploads since
    # 28 Apr 2026.
    runs-on: macos-26
    timeout-minutes: 45
    env:
      RELEASE: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Build number
        working-directory: .
        run: echo "BUILD_NUMBER=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci

      - name: Check release secrets
        if: env.RELEASE == 'true'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          missing=""
          for s in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8_BASE64; do
            [ -n "${!s}" ] || missing="$missing $s"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing (see mobile/docs/store-submission.md)"
            exit 1
          fi

      # Optional: without it the app still runs, but iOS hands the backend a
      # raw APNs token that its FCM sender can't deliver to.
      - name: Firebase config
        env:
          GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICE_INFO_PLIST_BASE64" ]; then
            echo "$GOOGLE_SERVICE_INFO_PLIST_BASE64" | base64 -d > ios/App/App/GoogleService-Info.plist
            ruby -e '
              require "xcodeproj"
              p = Xcodeproj::Project.open("ios/App/App.xcodeproj")
              t = p.targets.find { |x| x.name == "App" }
              g = p.main_group["App"]
              unless g.files.any? { |f| f.path == "GoogleService-Info.plist" }
                t.add_resources([g.new_file("GoogleService-Info.plist")])
                p.save
              end'
            echo "GoogleService-Info.plist added"
          else
            echo "::warning::GOOGLE_SERVICE_INFO_PLIST_BASE64 not set: iOS push tokens won't reach FCM"
          fi

      # cap sync runs pod install on macOS.
      - run: npx cap sync ios

      - name: Check build (simulator, unsigned)
        if: env.RELEASE != 'true'
        working-directory: mobile/ios/App
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -n 40
          exit ${PIPESTATUS[0]}

      - name: Archive and upload to TestFlight
        if: env.RELEASE == 'true'
        working-directory: mobile/ios/App
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          KEY="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          echo "${{ secrets.ASC_KEY_P8_BASE64 }}" | base64 -d > "$KEY"
          AUTH=(-allowProvisioningUpdates
                -authenticationKeyPath "$KEY"
                -authenticationKeyID "$ASC_KEY_ID"
                -authenticationKeyIssuerID "$ASC_ISSUER_ID")

          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            "${AUTH[@]}" archive | tail -n 40
          [ "${PIPESTATUS[0]}" -eq 0 ] || exit 1

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" "${AUTH[@]}"
          rm -f "$KEY"
          echo "Uploaded build $BUILD_NUMBER. It shows in App Store Connect -> TestFlight after processing (5-30 min)."
