name: Frontend CI

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # PR runs make way for newer pushes; a deploy to main is never cut short
  # halfway through loading the image on the server.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint (next lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: ESLint
        run: npm run lint

  typecheck:
    name: Typecheck (tsc --noEmit)
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: TypeScript
        run: npm run type-check

  build:
    name: Build (next build)
    runs-on: ubuntu-latest
    needs: typecheck
    defaults:
      run:
        working-directory: frontend
    env:
      # Build-time placeholder: this job only checks that the app builds.
      # The image the deploy job ships bakes in the production URL.
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-next-build
          path: |
            frontend/.next/
            !frontend/.next/cache/
          retention-days: 3

  deploy:
    # The site runs on the Hetzner VM next to the backend (Vercel's free
    # plan paused it on 2026-10-12). The image is built here, because a
    # Next build needs more memory than the VM spares, and streamed to the
    # server over SSH. The key can only run ops/deploy-frontend.sh there,
    # which loads the image, restarts the site and rolls back if it does
    # not answer.
    name: Deploy to the VM
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: frontend-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile.prod
          tags: holapolitica-frontend:latest
          outputs: type=docker,dest=/tmp/image.tar
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
      - name: Ship it to the server
        env:
          DEPLOY_KEY: ${{ secrets.VM_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.VM_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          gzip -c /tmp/image.tar | ssh -i ~/.ssh/deploy -o BatchMode=yes root@178.105.128.194
      - name: Check the live site
        run: |
          for _ in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://www.holapolitica.org/)
            [ "$code" = 200 ] && echo "www.holapolitica.org answers 200" && exit 0
            sleep 3
          done
          echo "::error::www.holapolitica.org answered $code"; exit 1
