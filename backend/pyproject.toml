[project]
name = "monitor-parlamentari-backend"
version = "0.1.0"
description = "Backend for Monitor Parlamentari — civic infrastructure for parliamentary transparency"
requires-python = ">=3.11"
license = "EUPL-1.2"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pydantic[email]>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "structlog>=24.1.0",
    "rq>=1.16.0",
    "rq-scheduler>=0.13.0",
    "redis>=5.0.0",
    "tenacity>=8.3.0",
    "python-slugify>=8.0.0",
    "python-multipart>=0.0.9",
    "pypdf>=5.0.0",
    "pywebpush>=2.0.0",
    "aiosmtplib>=3.0.0",
    # Rate limiter for the public POST endpoints. We previously had NO
    # abuse control on /newsletter, /alerts, /push/subscribe — anyone
    # could fire the confirmation email job at unbounded rate. slowapi
    # is the standard FastAPI-friendly limiter (in-memory by default,
    # uses Redis when configured) and weighs ~2 KB.
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "black>=24.4.0",
    "mypy>=1.10.0",
    "types-python-slugify>=8.0.0",
    "aiosqlite>=0.20.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    "alembic/versions",  # auto-generated migration files
    ".venv",
    "build",
    "dist",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "C90", "RUF"]
ignore = [
    "E501",   # line too long, black handles formatting
    "B008",   # function call in default argument — FastAPI's Depends/Query/Body idiom
    "RUF001", # ambiguous unicode in strings — multilingual CA/ES/EN content
    "RUF002", # ambiguous unicode in docstrings — multilingual CA/ES/EN content
    "RUF003", # ambiguous unicode in comments — multilingual CA/ES/EN content
    "C901",   # function-too-complex — judged case by case; flagged in PR review
]

[tool.ruff.lint.per-file-ignores]
"alembic/env.py" = ["F401", "F403"]  # star-import is intentional to register models

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]
exclude = [
    "^alembic/versions/",
    "^build/",
    "^\\.venv/",
]

# Third-party libraries without type stubs.
[[tool.mypy.overrides]]
module = ["pywebpush", "py_vapid"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Module-level singletons (Redis client, SQLAlchemy engine pool) bind to
# whatever event loop is active at first use. Function-scoped loops would
# cause "Future attached to a different loop" on the 2nd test that hits
# them. Share one loop across the session instead.
asyncio_default_test_loop_scope = "session"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
python_files = ["test_*.py"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
