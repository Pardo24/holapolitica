<!doctype html>
<!--
  Offline fallback, bundled inside the app binary (capacitor.config.ts
  server.errorPath). Shown when the WebView can't load the live site, so the
  app never opens to a blank screen. Self-contained: no network requests.
-->
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hola Política</title>
<style>
  :root { --paper: #fbf9f4; --ink: #1a2138; --muted: #5b6275; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--paper); color: var(--ink); }
  body {
    font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; align-items: center; justify-content: center;
    padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
    text-align: center;
  }
  main { max-width: 22rem; }
  svg { width: 72px; height: 72px; margin-bottom: 20px; }
  h1 { font-size: 1.35rem; margin: 0 0 8px; }
  p { margin: 0 0 24px; color: var(--muted); }
  button {
    font: inherit; font-weight: 600; color: var(--paper); background: var(--ink);
    border: 0; border-radius: 8px; padding: 12px 28px; min-height: 48px; cursor: pointer;
  }
  button:active { opacity: .85; }
</style>
</head>
<body>
<main>
  <svg viewBox="0 0 512 512" aria-hidden="true">
    <rect width="512" height="512" rx="96" fill="#fbf9f4"/>
    <g transform="translate(128 128)" stroke="#1a2138" stroke-width="22" stroke-linecap="square" fill="none">
      <rect x="0" y="0" width="256" height="256"/>
      <line x1="0" y1="80" x2="256" y2="80"/>
      <line x1="0" y1="160" x2="256" y2="160"/>
    </g>
  </svg>
  <h1 id="t">No hi ha connexió</h1>
  <p id="d">Hola Política mostra les dades del Congrés en directe i necessita internet. Comprova la connexió i torna-ho a provar.</p>
  <button id="b" type="button">Torna-ho a provar</button>
</main>
<script>
  (function () {
    var HOME = 'https://www.holapolitica.org/';
    var copy = {
      ca: ['No hi ha connexió', 'Hola Política mostra les dades del Congrés en directe i necessita internet. Comprova la connexió i torna-ho a provar.', 'Torna-ho a provar'],
      es: ['Sin conexión', 'Hola Política muestra los datos del Congreso en directo y necesita internet. Comprueba la conexión y vuelve a intentarlo.', 'Reintentar'],
      en: ['No connection', 'Hola Política shows live data from the Spanish Congress and needs the internet. Check your connection and try again.', 'Try again']
    };
    var langs = (navigator.languages || [navigator.language || 'ca']);
    var lang = 'ca';
    for (var i = 0; i < langs.length; i++) {
      var l = String(langs[i]).slice(0, 2).toLowerCase();
      if (copy[l]) { lang = l; break; }
    }
    var c = copy[lang];
    document.documentElement.lang = lang;
    document.getElementById('t').textContent = c[0];
    document.getElementById('d').textContent = c[1];
    var b = document.getElementById('b');
    b.textContent = c[2];
    function retry() { window.location.href = HOME; }
    b.addEventListener('click', retry);
    // Come back on our own as soon as the OS reports connectivity again.
    window.addEventListener('online', retry);
  })();
</script>
</body>
</html>
