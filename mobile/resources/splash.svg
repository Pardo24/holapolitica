<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2732 2732" width="2732" height="2732">
  <!-- Splash at 2732x2732 (the largest size Apple requires for iPad Pro).
       capacitor-assets generate downsamples this for every other slot.
       Brand mark centered on paper background, no editorial text. -->
  <rect width="2732" height="2732" fill="#fbf9f4"/>
  <g transform="translate(1110 1110)" stroke="#1a2138" stroke-width="44" stroke-linecap="square" fill="none">
    <rect x="0" y="0" width="512" height="512"/>
    <line x1="0" y1="160" x2="512" y2="160"/>
    <line x1="0" y1="320" x2="512" y2="320"/>
  </g>
</svg>
