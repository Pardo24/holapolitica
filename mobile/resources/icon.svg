<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Source icon for Hola Política. 1024x1024 as required by both
       Apple (App Store icon) and Google Play. Derived from frontend/public/icon.svg.
       capacitor-assets generate will produce all per-platform variants from this. -->
  <rect width="1024" height="1024" rx="192" fill="#fbf9f4"/>
  <g transform="translate(256 256)" stroke="#1a2138" stroke-width="44" stroke-linecap="square" fill="none">
    <rect x="0" y="0" width="512" height="512"/>
    <line x1="0" y1="160" x2="512" y2="160"/>
    <line x1="0" y1="320" x2="512" y2="320"/>
  </g>
</svg>
