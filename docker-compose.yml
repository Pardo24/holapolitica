name: monitor-parlamentari

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: ["python", "-m", "app.workers.runner"]

  # Listmonk newsletter: separate Postgres so Listmonk's schema is isolated
  # from the project's schema. Service named ``listmonk`` so the backend can
  # reach it via ``http://listmonk:9000`` from inside the docker network.
  listmonk-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: listmonk
      POSTGRES_PASSWORD: listmonk
      POSTGRES_DB: listmonk
    volumes:
      - listmonk-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U listmonk -d listmonk"]
      interval: 5s
      timeout: 5s
      retries: 5

  listmonk:
    image: listmonk/listmonk:latest
    restart: unless-stopped
    depends_on:
      listmonk-db:
        condition: service_healthy
    ports:
      - "9000:9000"
    environment:
      TZ: Europe/Madrid
      LISTMONK_app__address: 0.0.0.0:9000
      LISTMONK_db__host: listmonk-db
      LISTMONK_db__port: "5432"
      LISTMONK_db__user: listmonk
      LISTMONK_db__password: listmonk
      LISTMONK_db__database: listmonk
      LISTMONK_db__ssl_mode: disable
      LISTMONK_db__max_open: "25"
      LISTMONK_db__max_idle: "25"
      LISTMONK_db__max_lifetime: 300s
      LISTMONK_admin_username: ${LISTMONK_ADMIN_USERNAME:-admin}
      LISTMONK_admin_password: ${LISTMONK_ADMIN_PASSWORD:-Listmonk@admin1}
    # ``--install --idempotent`` creates tables on first run and is a no-op
    # afterwards. ``--upgrade --yes`` migrates schema between Listmonk
    # versions without prompting. Then we run the server.
    command:
      - sh
      - -c
      - |
        ./listmonk --install --idempotent --yes --config "" &&
        ./listmonk --upgrade --yes --config "" &&
        ./listmonk --config ""

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
      - frontend-next-cache:/app/.next
    ports:
      # Host port 3002 (3000 is taken by other dev tooling, 3001 by WSL
      # relay); the container still listens on 3000 internally.
      - "3002:3000"
    # Production mode by default (next start serves the built artifacts in
    # /app/.next which the anonymous volume preserves between restarts).
    # For active development with hot-reload, override with:
    #   docker compose run --rm --service-ports frontend npm run dev
    # or temporarily replace the command below with: ["npm", "run", "dev"]
    command: ["npm", "run", "start"]

volumes:
  postgres-data:
  redis-data:
  listmonk-db-data:
  frontend-node-modules:
  frontend-next-cache:
